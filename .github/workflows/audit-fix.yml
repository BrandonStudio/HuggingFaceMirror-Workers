name: Fix Audit Issues
on:
  workflow_dispatch:
permissions:
  pull-requests: write

jobs:
  npm-audit-fix:
    runs-on: ubuntu-latest
    name: Fix npm audit issues
    steps:
      - uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install dependencies
        run: |
          npm ci
      - name: Check for vulnerabilities
        id: audit
        run: |
          set -o pipefail
          npm audit | tee "${{ runner.temp }}/audit.txt" || echo "vulnerable=true" >> "$GITHUB_OUTPUT"
          npm audit --json > "${{ runner.temp }}/audit.json"
      - name: Find dependency chain
        if: steps.audit.outputs.vulnerable == 'true'
        shell: pwsh
        run: |
          $audit = Get-Content -Raw -Path "${{ runner.temp }}/audit.json" | ConvertFrom-Json
          $vulnerabilities = $audit.vulnerabilities.PSObject.Properties.Name
          foreach ($vulnerability in $vulnerabilities) {
            npm why $vulnerability | tee -a "${{ runner.temp }}/audit.txt"
          }
      - name: Fix vulnerabilities
        if: steps.audit.outputs.vulnerable == 'true'
        run: |
          npm audit fix
      - name: Create Pull Request
        if: steps.audit.outputs.vulnerable == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "Security updates"
          title: "Fix Security Vulnerabilities"
          body-path: "${{ runner.temp }}/audit.txt"
          base: ${{ github.ref_name }}
          branch: audit-fix/${{ github.run_id }}
